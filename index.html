<!DOCTYPE html>
<html lang="pl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLAN // VOLT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"]{
  --bg:#07080a;
  --surf:#101217;
  --surf-hi:#171a22;
  --ink:#f4f5f7;
  --mut:#7d8597;
  --line:#222631;
  --line-hi:#343a4a;
  --volt:#ccff00;
  --volt-ink:#07080a;
  --live:#00ff88;
  --c-w:#00d4ff;
  --c-l:#ff6b00;
  --c-c:#00e599;
  --c-lek:#b366ff;
  --c-p:#ff3366;
  --c-o:#8a94a6;
}
:root[data-theme="light"]{
  --bg:#f2f3f0;
  --surf:#ffffff;
  --surf-hi:#f7f8f6;
  --ink:#0d0f12;
  --mut:#5c6473;
  --line:#d6dae0;
  --line-hi:#aeb5c2;
  --volt:#b8e600;
  --volt-ink:#0d0f12;
  --live:#059669;
  --c-w:#0284c7;
  --c-l:#ea580c;
  --c-c:#059669;
  --c-lek:#7c3aed;
  --c-p:#e11d48;
  --c-o:#64748b;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--ink);
  font:15px/1.4 "Space Grotesk",system-ui,-apple-system,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

header{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:12px 16px;
}
.row{display:flex;align-items:center;gap:10px;max-width:700px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
h1{
  font-size:17px;margin:0;font-weight:700;letter-spacing:-.02em;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:8px;
}
h1 .mark{
  display:inline-block;padding:2px 7px;border-radius:2px;
  background:var(--volt);color:var(--volt-ink);font-size:12px;font-weight:700;
}
.sync{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:600;color:var(--mut);
  background:var(--surf);border:1px solid var(--line);
  padding:3px 8px;border-radius:2px;white-space:nowrap;
}
.sync .dot{width:6px;height:6px;border-radius:50%;background:var(--live);box-shadow:0 0 8px var(--live)}

button{
  font:inherit;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  border:1px solid var(--line);background:var(--surf);color:var(--ink);
  border-radius:3px;padding:7px 11px;cursor:pointer;
  transition:border-color .15s,background .15s,color .15s;
}
button:hover:not(:disabled){border-color:var(--volt);background:var(--surf-hi)}
button.p{background:var(--volt);border-color:var(--volt);color:var(--volt-ink)}
button.p:hover:not(:disabled){filter:brightness(1.06)}
button:disabled{opacity:.3;cursor:default}
button.ico{width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:15px}

.wk{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
}
.wk #pv{justify-self:start}
.wk b{justify-self:center;font-size:14px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.wk .nav{justify-self:end;display:flex;gap:6px;align-items:center}

main{max-width:700px;margin:0 auto;padding:10px 16px 60px}

.day{
  display:flex;align-items:center;justify-content:space-between;
  margin:26px 0 12px;padding:6px 0;
  border-bottom:1px solid var(--line);
  font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--mut);
}
.day.t{color:var(--ink);border-bottom:2px solid var(--volt)}
.day.past{opacity:.38}
.day .badge{
  font-size:11px;font-weight:700;padding:2px 8px;border-radius:2px;
  background:var(--volt);color:var(--volt-ink);
}

.none{
  color:var(--mut);font-size:12px;padding:10px 14px;
  background:var(--surf);border:1px dashed var(--line);border-radius:3px;
  text-transform:uppercase;letter-spacing:.04em;
}
.none.past{opacity:.38}

/* Szyna czasu (Timeline) */
.track{
  position:relative;
  padding-left:18px;
}
.track::before{
  content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;
  background:var(--line);
}
.track.past::before{opacity:.4}

/* Okienko wpięte w szynę */
.gap{
  position:relative;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:10px 0;padding:6px 12px;
  background:transparent;
  border:1px dashed var(--line-hi);
  border-radius:3px;
  font-size:11px;font-weight:600;text-transform:uppercase;color:var(--mut);
}
.gap::before{
  content:"";position:absolute;left:-17px;top:50%;transform:translateY(-50%);
  width:8px;height:8px;border-radius:50%;
  background:var(--bg);border:2px solid var(--line-hi);
}
.gap.past{opacity:.36}
.gap .dur{
  color:var(--ink);background:var(--surf);
  border:1px solid var(--line);padding:1px 7px;border-radius:2px;
}

/* Karta zajęć — High-Voltage Telemetry */
.ev{
  position:relative;overflow:hidden;
  display:flex;gap:14px;align-items:stretch;
  background:var(--surf);
  border:1px solid var(--line);
  border-left:3px solid var(--c);
  border-radius:3px;
  padding:13px 15px;margin:10px 0;
  transition:border-color .15s,transform .15s,background .15s;
}
.ev::before{
  content:"";position:absolute;left:-21px;top:20px;
  width:10px;height:10px;border-radius:2px;
  background:var(--c);box-shadow:0 0 10px color-mix(in srgb,var(--c) 60%,transparent);
}
.ev:hover{
  border-color:color-mix(in srgb,var(--c) 65%,var(--line));
  background:var(--surf-hi);
  transform:translateX(2px);
}
.ev.live{
  border-color:var(--live);border-left-color:var(--live);
  background:linear-gradient(90deg,color-mix(in srgb,var(--live) 10%,var(--surf)),var(--surf) 55%);
}
.ev.live::before{background:var(--live);box-shadow:0 0 12px var(--live)}
.ev.past{opacity:.36;filter:grayscale(.45)}
.ev.past::before{box-shadow:none}

.ev .tm{
  min-width:54px;padding-right:12px;border-right:1px solid var(--line);
  display:flex;flex-direction:column;justify-content:center;
  font-size:12px;color:var(--mut);
}
.ev .tm b{color:var(--ink);font-size:15px;font-weight:700;line-height:1.2}

.ev .body{flex:1;min-width:0}
.ev .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ev .nm{font-weight:700;font-size:15px;line-height:1.3;letter-spacing:-.01em}

.pill{
  display:inline-flex;align-items:center;gap:5px;flex-shrink:0;
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  padding:2px 7px;border-radius:2px;white-space:nowrap;
}
.pill.live{background:var(--live);color:#07080a}
.pill.live i{width:5px;height:5px;border-radius:50%;background:#07080a;animation:pulse 1.2s infinite}
.pill.next{background:var(--volt);color:var(--volt-ink)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.ev .mt{
  display:flex;flex-wrap:wrap;align-items:center;gap:7px;
  margin-top:8px;font-size:12px;color:var(--mut);
}
.tag{
  display:inline-block;padding:2px 7px;border-radius:2px;
  font-size:11px;font-weight:700;text-transform:uppercase;
  color:var(--c);
  background:color-mix(in srgb,var(--c) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--c) 45%,transparent);
}
.room{
  padding:2px 7px;border-radius:2px;font-size:11px;font-weight:600;
  background:var(--bg);border:1px solid var(--line);color:var(--ink);
}

.prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--line)}
.prog span{display:block;height:100%;background:var(--live);transition:width .5s linear}

.legend{
  display:flex;flex-wrap:wrap;gap:14px;justify-content:center;
  margin-top:30px;padding:12px 16px;
  background:var(--surf);border:1px solid var(--line);border-radius:3px;
  font-size:11px;font-weight:600;text-transform:uppercase;color:var(--mut);
}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}

.set{padding:6px 0}
.set h2{font-size:20px;font-weight:700;margin:6px 0;text-transform:uppercase}
.set p{color:var(--mut);margin:4px 0 16px;font-size:14px}
.q{background:var(--surf);border:1px solid var(--line);border-left:3px solid var(--volt);border-radius:3px;padding:13px 15px;margin:10px 0}
.q .nm{font-weight:700;margin-bottom:10px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{padding:5px 11px;font-size:12px}
.chips button.on{background:var(--volt);border-color:var(--volt);color:var(--volt-ink)}
.err{padding:32px 0;text-align:center;color:var(--mut);font-size:13px;font-weight:600;text-transform:uppercase}
</style>
</head>
<body>
<header>
  <div class="row">
    <div class="brand">
      <h1 id="ttl"><span class="mark mono">EE</span> PLAN</h1>
      <span id="sync" class="sync mono" hidden><span class="dot"></span><span id="syncTxt"></span></span>
    </div>
    <button id="thm" class="ico" title="Zmień motyw">☀</button>
    <button id="chg" class="mono" hidden>Grupy</button>
  </div>
  <div class="row wk" id="wk" hidden>
    <button id="pv" class="ico mono" aria-label="Poprzedni tydzień">‹</button>
    <b id="wl" class="mono"></b>
    <div class="nav">
      <button id="tdy" class="mono">Dziś</button>
      <button id="nx" class="ico mono" aria-label="Następny tydzień">›</button>
    </div>
  </div>
</header>
<main id="app"><div class="err mono">Ładowanie danych…</div></main>
<script>
var $=function(i){return document.getElementById(i)};
var DAYS=["Niedziela","Poniedziałek","Wtorek","Środa","Czwartek","Piątek","Sobota"];
var events=[],calName="plan",choices={},sel={},off=0,minD,maxD;

/* Motyw Dark / Light */
(function(){
  var saved=localStorage.getItem("plan:theme")||"dark";
  document.documentElement.setAttribute("data-theme",saved);
  $("thm").textContent=saved==="dark"?"☀":"☾";
  $("thm").onclick=function(){
    var cur=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",cur);
    localStorage.setItem("plan:theme",cur);
    $("thm").textContent=cur==="dark"?"☀":"☾";
  };
})();

function unesc(s){return s.replace(/\\n/gi,"\n").replace(/\\([,;])/g,"$1").replace(/\\\\/g,"\\")}
function pd(s){return new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),+s.slice(9,11),+s.slice(11,13))}
function parse(txt){
  txt=txt.replace(/\r?\n[ \t]/g,"");
  var m=txt.match(/X-WR-CALNAME:(.*)/);calName=m?m[1].trim():"plan";
  var out=[],parts=txt.split("BEGIN:VEVENT").slice(1);
  parts.forEach(function(p){
    var g=function(k){var r=p.match(new RegExp("^"+k+"[^:\\n]*:(.*)$","m"));return r?r[1].replace(/\r$/,""):""};
    var d={};unesc(g("DESCRIPTION")).split("\n").forEach(function(l){var i=l.indexOf(":");if(i>0)d[l.slice(0,i).trim()]=l.slice(i+1).trim()});
    var s=g("DTSTART"),e=g("DTEND");if(!s)return;
    out.push({s:pd(s),e:e?pd(e):pd(s),sub:d["Przedmiot"]||unesc(g("SUMMARY")).split(",")[0],grp:d["Grupa"]||"",who:d["Prowadzący"]||"",room:d["Sala"]||""});
  });
  out.sort(function(a,b){return a.s-b.s});return out;
}
function pre(g){return g.replace(/\d+$/,"")}
function gl(e){return e.grp?e.grp.split(/\s*,\s*/):[]}
function fromJson(j){
  if(j.updatedAt){
    var u=new Date(j.updatedAt);
    if(!isNaN(u)){
      $("syncTxt").textContent="SYNC "+hm(u);
      $("sync").hidden=false;
    }
  }
  var out=[],codes=j.codes||[];
  (j.data||[]).forEach(function(it){
    var fac=(it.faculty||"").split(/\s*,\s*/);
    if(codes.length&&!codes.some(function(c){return fac.indexOf(c)>=0}))return;
    (it.terminy||[]).forEach(function(t){
      var cl=function(x){return (x||"").replace(/_+$/,"")};
      var r=cl(t.room);if(/^\d\d-\d\d_/.test(r))r="";
      out.push({s:new Date(t.start),e:new Date(t.end),sub:t.eventType||it.eventType||it.title,grp:t.group||"",who:cl(t.instructor||it.instructor),room:r});
    });
  });
  out.sort(function(a,b){return a.s-b.s});return out;
}
function typeColor(grp){
  var g=(grp||"").trim().toUpperCase();
  if(/^LEK/.test(g))return "var(--c-lek)";
  if(/^W/.test(g))return "var(--c-w)";
  if(/^L/.test(g))return "var(--c-l)";
  if(/^[CĆ]/.test(g))return "var(--c-c)";
  if(/^[PS]/.test(g))return "var(--c-p)";
  return "var(--c-o)";
}
function buildChoices(){
  var o={};events.forEach(function(e){gl(e).forEach(function(g){var k=e.sub+"|"+pre(g);(o[k]=o[k]||{sub:e.sub,pre:pre(g),g:{}}).g[g]=1})});
  choices={};Object.keys(o).forEach(function(k){var n=Object.keys(o[k].g);if(n.length>1)choices[k]={sub:o[k].sub,pre:o[k].pre,g:n.sort(function(a,b){return a.localeCompare(b,"pl",{numeric:true})})}});
}
function load(){try{sel=JSON.parse(localStorage.getItem("plan:"+calName)||"{}")}catch(x){sel={}}}
function save(){try{localStorage.setItem("plan:"+calName,JSON.stringify(sel))}catch(x){}}
function done(){return Object.keys(choices).every(function(k){return sel[k]!==undefined})}
function vis(e){var L=gl(e);if(!L.length)return true;return L.some(function(g){var k=e.sub+"|"+pre(g);return !choices[k]||sel[k]===g})}
function mon(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function hm(d){return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
function ddmm(d){return ("0"+d.getDate()).slice(-2)+"."+("0"+(d.getMonth()+1)).slice(-2)}
function fmtDur(m){
  if(m<60)return m+" MIN";
  var h=Math.floor(m/60),rm=m%60;
  return h+"H"+(rm?" "+rm+"M":"");
}
function fmtCountdown(ms){return "ZA "+fmtDur(Math.ceil(ms/60000))}
function el(t,c,h){var x=document.createElement(t);if(c)x.className=c;if(h!==undefined)x.textContent=h;return x}

function setup(){
  $("wk").hidden=true;$("chg").hidden=true;var a=$("app");a.innerHTML="";
  var w=el("div","set");w.appendChild(el("h2","","Konfiguracja grup"));
  w.appendChild(el("p","","Zaznacz grupę przy każdym przedmiocie. Wybór zapisze się w przeglądarce."));
  var go=el("button","p mono","Zapisz i pokaż plan");go.disabled=!done();
  Object.keys(choices).sort(function(a,b){return choices[a].sub.localeCompare(choices[b].sub,"pl")}).forEach(function(k){
    var c=choices[k],q=el("div","q"),ch=el("div","chips");
    q.appendChild(el("div","nm",c.sub+(c.pre?" ["+c.pre+"]":"")));
    c.g.concat([""]).forEach(function(g){
      var b=el("button","mono"+(sel[k]===g?" on":""),g||"brak");
      b.onclick=function(){sel[k]=g;save();[].forEach.call(ch.children,function(x){x.className="mono"});b.className="mono on";go.disabled=!done()};
      ch.appendChild(b)});
    q.appendChild(ch);w.appendChild(q)});
  go.onclick=function(){render(true)};w.appendChild(go);a.appendChild(w);
}

function render(reset){
  if(!done()){setup();return}
  if(reset)off=0;
  var now=new Date(),todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var m0=mon(now),first=mon(minD),last=mon(maxD);
  var wk=new Date(m0);wk.setDate(wk.getDate()+7*off);
  if(wk<first){wk=first;off=Math.round((wk-m0)/6048e5)}if(wk>last){wk=last;off=Math.round((wk-m0)/6048e5)}
  var end=new Date(wk);end.setDate(end.getDate()+7);
  $("wk").hidden=false;$("chg").hidden=false;
  var fr=new Date(wk),to=new Date(wk);to.setDate(to.getDate()+4);
  $("wl").textContent=ddmm(fr)+" — "+ddmm(to);
  $("pv").disabled=wk<=first;$("nx").disabled=wk>=last;
  var a=$("app");a.innerHTML="";
  var mine=events.filter(function(e){return vis(e)&&e.s>=wk&&e.s<end});

  var nextEv=mine.find(function(e){return e.s>now&&e.s.toDateString()===now.toDateString()});

  for(var i=0;i<7;i++){
    var d=new Date(wk);d.setDate(d.getDate()+i);
    var de=mine.filter(function(e){return e.s.getDate()===d.getDate()&&e.s.getMonth()===d.getMonth()});
    if(i>4&&!de.length)continue;
    var isToday=d.toDateString()===now.toDateString();
    var isPastDay=d<todayStart;
    var dh=el("div","day"+(isToday?" t":"")+(isPastDay?" past":""));
    dh.appendChild(el("span","",DAYS[d.getDay()]+" · "+ddmm(d)));
    if(isToday)dh.appendChild(el("span","badge mono","DZIŚ"));
    a.appendChild(dh);

    if(!de.length){a.appendChild(el("div","none mono"+(isPastDay?" past":""),"Brak zajęć"));continue}

    var track=el("div","track"+(isPastDay?" past":""));
    de.forEach(function(e,idx){
      if(idx>0){
        var gapMin=Math.round((e.s-de[idx-1].e)/60000);
        if(gapMin>=30){
          var isPastGap=now>e.s;
          var g=el("div","gap mono"+(isPastGap?" past":""));
          g.appendChild(el("span","","OKIENKO "+hm(de[idx-1].e)+"–"+hm(e.s)));
          g.appendChild(el("span","dur",fmtDur(gapMin)));
          track.appendChild(g);
        }
      }

      var isLive=now>=e.s&&now<=e.e;
      var isPast=now>e.e;
      var c=el("div","ev"+(isLive?" live":"")+(isPast?" past":""));
      c.style.setProperty("--c",typeColor(e.grp));

      var tm=el("div","tm mono");
      tm.appendChild(el("b","",hm(e.s)));
      tm.appendChild(document.createTextNode(hm(e.e)));

      var b=el("div","body");
      var top=el("div","top");
      top.appendChild(el("div","nm",e.sub));
      if(isLive){
        var p=el("span","pill live mono");p.appendChild(document.createElement("i"));p.appendChild(document.createTextNode("LIVE"));
        top.appendChild(p);
      }else if(e===nextEv){
        top.appendChild(el("span","pill next mono",fmtCountdown(e.s-now)));
      }
      b.appendChild(top);

      var mt=el("div","mt");
      if(e.grp)mt.appendChild(el("span","tag mono",e.grp));
      if(e.room)mt.appendChild(el("span","room mono","SALA "+e.room));
      if(e.who)mt.appendChild(el("span","",e.who));
      b.appendChild(mt);

      c.appendChild(tm);c.appendChild(b);

      if(isLive){
        var pct=Math.max(0,Math.min(100,((now-e.s)/(e.e-e.s))*100));
        var pr=el("div","prog"),bar=document.createElement("span");
        bar.style.width=pct.toFixed(1)+"%";pr.appendChild(bar);c.appendChild(pr);
      }
      track.appendChild(c);
    });
    a.appendChild(track);
  }

  var lg=el("div","legend mono");
  [["Wykład","var(--c-w)"],["Lab","var(--c-l)"],["Ćwiczenia","var(--c-c)"],["Lektorat","var(--c-lek)"],["Projekt / Sem","var(--c-p)"]].forEach(function(x){
    var s=el("span",""),dot=document.createElement("i");dot.style.background=x[1];
    s.appendChild(dot);s.appendChild(document.createTextNode(x[0]));lg.appendChild(s);
  });
  a.appendChild(lg);
}

function init(evs,name){
  events=evs;calName=name;if(!events.length)throw 0;
  minD=events[0].s;maxD=events[events.length-1].s;
  var code=calName.replace(/^.*faculty:\s*/,"");
  $("ttl").innerHTML='<span class="mark mono">'+code+'</span> PLAN ZAJĘĆ';
  buildChoices();load();render(false);
  setInterval(function(){if(!$("wk").hidden)render(false)},30000);
}

$("pv").onclick=function(){off--;render(false)};
$("nx").onclick=function(){off++;render(false)};
$("tdy").onclick=function(){render(true)};
$("chg").onclick=setup;
var sx=0;document.addEventListener("touchstart",function(e){sx=e.touches[0].clientX});
document.addEventListener("touchend",function(e){var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>80&&!$("wk").hidden){off+=dx<0?1:-1;render(false)}});

var NF=function(r){if(!r.ok)throw 0;return r};
fetch("plan.json?"+Date.now()).then(NF).then(function(r){return r.json()}).then(function(j){init(fromJson(j),(j.codes||["plan"]).join("+"))})
 .catch(function(){return fetch("plan.ics?"+Date.now()).then(NF).then(function(r){return r.text()}).then(function(t){var ev=parse(t);init(ev,calName)})})
 .catch(function(){$("app").innerHTML='<div class="err mono">Błąd // Nie udało się wczytać planu.</div>'});
</script>
