name: Aktualizuj plan
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz i przygotuj plan
        env:
          API_URL: ${{ vars.PLAN_API_URL }}
          KIERUNKI: ${{ vars.KIERUNKI }}
        run: |
          curl -fsSL -A "plan-bot (projekt studencki)" "$API_URL" -o raw.json
          python3 build_plan.py
          rm raw.json
      - name: Zapisz zmiany
        run: |
          git config user.name "plan-bot"
          git config user.email "plan-bot@users.noreply.github.com"
          git add plan.json
          git diff --cached --quiet || (git commit -m "Aktualizacja planu" && git push)
