name: Aktualizuj plan

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pobierz i przygotuj plan
        env:
          API_URL: ${{ vars.PLAN_API_URL }}
          KIERUNKI: ${{ vars.KIERUNKI }}
        run: |
          curl -fsSL -A "plan-bot (projekt studencki)" "$API_URL" -o raw.json
          python3 build_plan.py

      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plan.json
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizacja planu"
            git push
          fi
